<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D 手语模型</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f6f5ec}canvas{display:block}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.2, 3.5);
camera.lookAt(0, 1, 0);
var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
new THREE.AmbientLight(0xffffff, 1.0); scene.add(new THREE.AmbientLight(0xffffff, 1.0));
var dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1,2,3); scene.add(dl);
var dl2 = new THREE.DirectionalLight(0xffffff, 0.6); dl2.position.set(-1,1,-2); scene.add(dl2);

// 从 GitHub CDN 加载 GLB
var loader = new THREE.GLTFLoader();
loader.load(
  'https://cdn.jsdelivr.net/gh/haitangmu-dot/sign-3d-model@main/avatar.glb',
  function(gltf){
    scene.add(gltf.scene);
    document.body.innerHTML = document.body.innerHTML + '<div style="position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;">单指旋转 · 双指缩放</div>';
  },
  undefined,
  function(err){ console.error('GLB 加载失败', err); }
);

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
